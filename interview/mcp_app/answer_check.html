<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal answer check</title>
<style>
/* MCP Apps view. Self-contained: inline CSS/JS only, no network access (works under the host's default CSP). */
:root{--bg:var(--color-background-primary,#fffefb);--ink:var(--color-text-primary,#252b28);--muted:var(--color-text-secondary,#7f8676);--line:#e6e8de;--ok-bg:#e4ebdb;--ok:#56704f;--watch-bg:#f5ead9;--watch:#a07142;--miss-bg:#f6e0d6;--miss:#b05a37;--flag-bg:#f1e6db;--flag:#9b6f50;--good-bg:#e8eddf;--good:#5f7650;--accent:#ce643e}
:root.dark{--bg:var(--color-background-primary,#1e211f);--ink:var(--color-text-primary,#eceee6);--muted:var(--color-text-secondary,#a7ad9c);--line:#343a35;--ok-bg:#2d3a2b;--ok:#b5cfa9;--watch-bg:#3d3222;--watch:#e2bf8e;--miss-bg:#43281f;--miss:#f0a787;--flag-bg:#3a2d24;--flag:#e4b48f;--good-bg:#2c3727;--good:#bdd5ad}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--font-sans,system-ui,-apple-system,'Segoe UI',sans-serif)}
main{padding:16px 18px}
.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
h1{font-size:15px;margin:4px 0 2px;font-weight:600}
.meta{font-size:11px;color:var(--muted);margin:0 0 10px}
.priority{border-left:3px solid var(--accent);padding:6px 10px;margin:10px 0 6px;font-size:13px}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pill{font-size:10px;border-radius:20px;padding:3px 8px;text-align:center;align-self:start}
.ok{background:var(--ok-bg);color:var(--ok)}.watch{background:var(--watch-bg);color:var(--watch)}.missing{background:var(--miss-bg);color:var(--miss)}.same{background:var(--line);color:var(--muted)}
strong{font-weight:600}
p{margin:2px 0}
.note{color:var(--muted);font-size:12px}
.quotes{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
q{font-size:12px;padding:2px 8px;border-radius:5px}
q.flag{background:var(--flag-bg);color:var(--flag)}q.good{background:var(--good-bg);color:var(--good)}
.suggest{color:var(--watch);font-size:12px;margin-top:4px}
.foot{color:var(--muted);font-size:11px;margin-top:10px}
.waiting{color:var(--muted);padding:8px 0}
@media(max-width:420px){.row{grid-template-columns:1fr}.pill{justify-self:start}}
</style>
</head>
<body>
<main id="root"><p class="waiting">Waiting for the answer check…</p></main>
<script>
(()=>{
const root=document.getElementById('root');
const STATUS={missing:'Missing',watch:'Worth a look',ok:'Clear'},MOVE={toward:'Moved toward',same:'No change',away:'Moved away'};
let nextId=1;const pending=new Map();
const post=msg=>window.parent.postMessage(msg,'*');
function request(method,params){const id=nextId++;post({jsonrpc:'2.0',id,method,params});return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function notify(method,params){post({jsonrpc:'2.0',method,params});}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function quotes(list,cls){const w=el('div','quotes');(list||[]).forEach(q=>w.append(el('q',cls,q)));return w;}
function renderCheck(r){root.replaceChildren(el('span','eyebrow','Rehearsal · rule check'),el('h1','',r.priority?`Start here: ${r.priority.label}`:'Every checked signal is present'),el('p','meta',`${r.words} words · deterministic wording rules · no AI model, no scores`));
 if(r.priority)root.append(el('p','priority',r.priority.suggestion));
 r.signals.forEach(s=>{const row=el('div','row'),body=el('div');body.append(el('strong','',s.label),el('p','note',s.note));if(s.quotes.length)body.append(quotes(s.quotes,s.status==='ok'?'good':'flag'));if(s.status!=='ok')body.append(el('p','suggest',s.suggestion));row.append(el('span','pill '+s.status,STATUS[s.status]||s.status),body);root.append(row);});
 root.append(el('p','foot',r.source));}
function renderCompare(r){root.replaceChildren(el('span','eyebrow','Rehearsal · first take vs retry'),el('h1','',r.summary),el('p','meta',`${r.before_words} → ${r.after_words} words`));
 r.changes.forEach(c=>{const row=el('div','row'),body=el('div');body.append(el('strong','',`${c.label}: ${c.before_count} → ${c.after_count}`),quotes(c.before_quotes,'flag'),quotes(c.after_quotes,'good'));row.append(el('span','pill '+(c.direction==='toward'?'ok':c.direction==='away'?'missing':'same'),MOVE[c.direction]),body);root.append(row);});
 root.append(el('p','priority',`Next: ${r.next_step}`),el('p','foot',r.note));}
function render(result){
 if(result?.isError){root.replaceChildren(el('p','note',result.content?.[0]?.text||'The check could not run.'));return;}
 let data=result?.structuredContent;
 if(data&&data.result&&!data.signals&&!data.changes)data=data.result;
 if(!data){try{data=JSON.parse(result.content.find(c=>c.type==='text').text);}catch{data=null;}}
 if(data?.signals)renderCheck(data);else if(data?.changes)renderCompare(data);else root.replaceChildren(el('p','note','No answer check data in this result.'));}
function applyContext(ctx){if(!ctx)return;document.documentElement.classList.toggle('dark',ctx.theme==='dark');const vars=ctx.styles?.variables||{};Object.entries(vars).forEach(([k,v])=>{if(v)document.documentElement.style.setProperty(k,v);});}
window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;
 if(m.id!==undefined&&pending.has(m.id)&&!m.method){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}
 if(m.method==='ui/notifications/tool-input')root.replaceChildren(el('p','waiting','Checking the answer…'));
 else if(m.method==='ui/notifications/tool-result')render(m.params);
 else if(m.method==='ui/notifications/host-context-changed')applyContext(m.params);
 else if(m.method==='ui/notifications/tool-cancelled')root.replaceChildren(el('p','note','The check was cancelled.'));
 else if(m.method==='ping'&&m.id!==undefined)post({jsonrpc:'2.0',id:m.id,result:{}});});
let lastSize='';new ResizeObserver(()=>{const size=`${document.documentElement.scrollWidth}x${document.documentElement.scrollHeight}`;if(size!==lastSize){lastSize=size;notify('ui/notifications/size-changed',{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight});}}).observe(document.documentElement);
request('ui/initialize',{protocolVersion:'2025-06-18',appInfo:{name:'Rehearsal answer check',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']}})
 .then(r=>{applyContext(r?.hostContext);notify('ui/notifications/initialized',{});})
 .catch(()=>{root.replaceChildren(el('p','note','This view needs an MCP Apps host.'));});
})();
</script>
</body>
</html>
